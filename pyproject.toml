[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mujoco-uni-bench"
version = "0.1.0"
description = "Benchmark suite for MuJoCoUni (BatchEnvPool) vs Python baselines"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
mujoco-uni-runtime = ["mujoco_uni_runtime"]
mujoco = ["mujoco"]

[project.scripts]
mujoco-uni-bench = "mujoco_uni_bench.run:main"
mujoco-uni-plot = "mujoco_uni_bench.plotting.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mujoco_uni_bench"]
